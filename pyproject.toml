[tool.poetry]
name = "sales-data-pipeline"
version = "0.1.4"
description = "PySpark-based Sales Data Processing Pipeline"
authors = ["Ankita Manral <ankitam.is.on@gmail.com>"]
readme = "README.md"
packages = [
    { include = "sales_data", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

[tool.poetry.group.local.dependencies]
pyspark = "3.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.2.0"
chispa = "0.12.0"
ruff = "^0.11.0"
mypy = "^1.15.0"
pre-commit = "^4.2.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
sales-data = "sales_data.main:main"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["src/sales_data/main.py"]
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_configs = true
